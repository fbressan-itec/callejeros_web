<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — Callejeros Río Cuarto</title>
  
  <meta name="description" content="Iniciá sesión en Callejeros Río Cuarto para gestionar tus favoritos, adoptar y reportar alertas comunitarias.">
  <meta name="theme-color" content="#ea580c">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              orange: '#ea580c',
              'orange-light': '#ff7849',
              'orange-dark': '#c2410c',
              green: '#10b981',
              red: '#ef4444',
            },
            slate: {
              750: '#293548',
              850: '#151e2e',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Poppins', 'sans-serif'],
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
            'soft-dark': '0 4px 20px -2px rgba(0, 0, 0, 0.3)',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200 antialiased selection:bg-orange-500 selection:text-white">

  <!-- NAVBAR SIMPLIFICADO -->
  <header class="sticky top-0 z-50 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800 transition-colors duration-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center group focus:outline-none focus-visible:ring-2 focus-visible:ring-orange-500 rounded-xl p-1" aria-label="Ir al inicio">
        <img src="public/images/logo_callejeros.jpg" alt="Logo Callejeros" class="h-11 sm:h-12 w-auto object-contain rounded-lg shadow-sm">
      </a>

      <div class="flex items-center gap-3">
        <button type="button" id="theme-toggle" class="p-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 min-w-[44px] min-h-[44px] flex items-center justify-center" aria-label="Alternar tema">
          <svg class="w-6 h-6 hidden dark:block text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <svg class="w-6 h-6 block dark:hidden text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- CONTENIDO: LOGIN FORM (Fiel a ruta_loguin_mobile.png) -->
  <main class="flex-grow flex items-center justify-center p-4 sm:p-6">
    <div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-soft dark:shadow-soft-dark p-6 sm:p-8 space-y-6">
      
      <!-- Botón Volver (estilo Figma "<") -->
        <a href="index.html" data-back class="inline-flex items-center gap-1.5 min-w-[44px] min-h-[44px] px-3 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-600 active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-orange-500 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-slate-800 transition-all" aria-label="Volver a la pantalla anterior">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
          <span class="hidden sm:inline text-sm font-semibold">Volver</span>
        </a>

      <div class="text-center space-y-2">
        <div class="w-16 h-16 rounded-full bg-orange-100 dark:bg-orange-950/60 text-orange-600 dark:text-orange-400 flex items-center justify-center text-3xl mx-auto shadow-inner">
          👤
        </div>
        <h1 class="font-display font-extrabold text-2xl text-slate-900 dark:text-white">Iniciar Sesión</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400">Ingresá tu correo para acceder a tu perfil y reportes</p>
      </div>

      <form id="form-login" class="space-y-4">
        <div>
          <label for="login-email" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Correo Electrónico</label>
          <input type="email" id="login-email" required placeholder="tu@correo.com" class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-850 text-base focus:outline-none focus:ring-2 focus:ring-orange-500">
        </div>

        <div>
          <label for="login-password" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Contraseña</label>
          <div class="relative">
            <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-850 text-base focus:outline-none focus:ring-2 focus:ring-orange-500 pr-12">
            <button type="button" class="toggle-password-btn absolute right-0 top-1/2 -translate-y-1/2 min-w-[44px] min-h-[44px] flex items-center justify-center text-slate-400 hover:text-slate-700 dark:hover:text-slate-200" aria-label="Mostrar u ocultar contraseña">
              👁️
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between text-xs">
          <label class="flex items-center gap-2 cursor-pointer text-slate-600 dark:text-slate-300">
            <input type="checkbox" class="rounded text-orange-500 focus:ring-orange-500">
            <span>Recordarme</span>
          </label>
          <a href="recuperar.html" class="inline-flex items-center min-h-[44px] text-orange-600 dark:text-orange-400 hover:underline">¿Olvidaste tu clave?</a>
        </div>

        <button type="submit" class="w-full py-3.5 rounded-xl font-bold text-sm text-white bg-orange-500 hover:bg-orange-600 active:scale-95 shadow-md shadow-orange-500/20 transition-all">
          Ingresar
        </button>
      </form>

      <div class="pt-4 border-t border-slate-100 dark:border-slate-700/60 text-center text-xs text-slate-600 dark:text-slate-400">
        <span>¿No tenés una cuenta todavía?</span>
        <a href="registro.html" class="font-bold text-orange-600 dark:text-orange-400 hover:underline ml-1">
          Registrate acá
        </a>
      </div>

    </div>
  </main>

  <footer class="bg-white dark:bg-slate-950 border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-600 dark:text-slate-300">
    <p>© 2026 Callejeros Río Cuarto. Acceso seguro.</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
